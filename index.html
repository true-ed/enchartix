<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Enchartix 3D</title>
	<style>
		body {
			margin: 0;
			padding: 24px;
			background: #000000;
			color: #cccccc;
			font-family: system-ui, -apple-system, sans-serif;
		}
		.block {
			max-width: 1000px;
			margin: 0 auto 32px;
		}
		.bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
			font-size: 14px;
		}
		.light-prompt {
			padding: 20px;
			border: 1px solid #222;
			border-radius: 8px;
			background: #050505;
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 14px;
		}
		button {
			background: #1a1a1a;
			color: #ddd;
			border: 1px solid #333;
			padding: 6px 14px;
			border-radius: 4px;
			cursor: pointer;
		}
		button:hover {
			background: #2a2a2a;
		}
		.hidden {
			display: none;
		}
	</style>
</head>
<body class="theme-dark">

	<div class="block">
		<div class="bar">
			<span>Dark Theme</span>
			<input type="color" id="fit-color" value="#7d33ff" />
		</div>
		<div id="graph-container"></div>
	</div>

	<div class="block">
		<div class="bar">
			<span>Light Theme</span>
			<input type="color" id="eng-color" value="#00b894" />
		</div>

		<div id="light-graph-gate" class="light-prompt">
			<span>This graph is light. Show it?</span>
			<button id="reveal-light-btn">Yes</button>
		</div>

		<div id="eng-graph-container" class="hidden"></div>
	</div>

	<script type="module" src="/demo/demo.js"></script>
</body>
</html>
